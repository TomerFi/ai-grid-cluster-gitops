skipCrdCheck: true
components:
  aigateway:
    modelsAsAService:
      gateway:
        name: maas-default-gateway
        namespace: openshift-ingress
        annotations:
          ai-grid/maas-gateway-hostname-prefix: maas

operator:
  type: rhoai
  rhoai:
    olm:
      # Nightly catalog (image ref managed in apps/rhoai/nightly.yaml);
      # requires prerequisites distributed by apps/rhoai-prerequisites.
      source: rhoai-catalog-dev
      channel: stable-3.6
      # ACM owns this Red Hat managed Namespace; OSD rejects Argo writes to it.
      createNamespace: false
dependencies:
  # The pinned odh-model-controller programs the serving gateway's auth cluster
  # with TLS to authorino (EnvoyFilter openshift-ai-inference-authn-ssl), so
  # authorino must serve TLS. The cert is the service-ca secret
  # authorino-server-cert, generated by the serving-cert annotation on the
  # authorino service. mtls.authorino makes the kuadrant operator switch its own
  # EnvoyFilters to TLS so the MaaS gateway keeps working.
  rhcl:
    config:
      tlsEnabled: true
      spec:
        mtls:
          authorino: true
  opentelemetry:
    olm:
      # Keep aligned with the cert-manager compatibility grant in apps/rhoai-prerequisites/hub/12-otel-cert-manager-policy.yaml.
      namespace: openshift-opentelemetry-operator
# The payload's Grid runtimes. Argo renders these charts, not the operator, so
# they name the images the operator's payload ships.
global:
  relatedImages:
    - name: RELATED_IMAGE_ODH_PRAXIS_AI_GRID_GATEWAY_IMAGE
      value: registry.redhat.io/rhoai/odh-praxis-ai-grid-gateway-rhel9@sha256:a28f497b0eb01878c64b05a048dd5906dab399b991db263873030e7fe7ae1665
